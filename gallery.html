<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Group 1 Entertainment Studios</title>
    <meta
      name="description"
      content="See inside Group 1 Entertainment Studios in Marietta and Atlanta. Control room, vocal booth, and session environment."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrap">
      <header class="site-nav">
        <div class="container nav-inner">
          <a href="index.html" class="logo-wrap" aria-label="Group 1 Entertainment Studios home">
            <span class="logo-main">Group 1</span>
            <span class="logo-sub">Entertainment Studios</span>
          </a>
          <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="menu-icon"></span>
          </button>
          <nav class="nav-links" id="siteNav">
            <a href="index.html" class="nav-link" data-page="index.html">Home</a>
            <a href="gallery.html" class="nav-link" data-page="gallery.html">Gallery</a>
            <a href="music.html" class="nav-link" data-page="music.html">Music</a>
            <a
              href="https://docs.google.com/forms/d/e/1FAIpQLSf44cyN2bdYfoEMPh-fRe0driMsOFy9_rSdxSju_usiPobDkA/viewform?usp=dialog"
              class="nav-link nav-cta"
              target="_blank"
              rel="noopener"
              >Book Now</a
            >
          </nav>
        </div>
      </header>

      <main>
        <section class="page-hero">
          <div class="container">
            <h1 class="section-title">Inside The Studio</h1>
          </div>
        </section>

        <section class="section" style="padding-top: 0">
          <div class="container">
            <div class="gallery-grid">
              <button
                type="button"
                class="gallery-item"
                data-lightbox-src="images/Setup.webp"
                data-lightbox-alt="Studio setup"
                aria-label="Open MIX POSITION image"
              >
                <img src="images/Setup.webp" alt="Mix position" loading="lazy" />
                <span class="gallery-label">Mix Position</span>
              </button>

              <button
                type="button"
                class="gallery-item"
                data-lightbox-src="images/Setup_With_Mic.webp"
                data-lightbox-alt="Computer and mix setup"
                aria-label="Open CONTROL ROOM image"
              >
                <img src="images/Setup_With_Mic.webp" alt="Control room" loading="lazy" />
                <span class="gallery-label">Control Room</span>
              </button>

              <button
                type="button"
                class="gallery-item"
                data-lightbox-src="images/Mic.webp"
                data-lightbox-alt="Microphone and vocal booth"
                aria-label="Open VOCAL BOOTH image"
              >
                <img src="images/Mic.webp" alt="Vocal booth" loading="lazy" />
                <span class="gallery-label">Vocal Booth</span>
              </button>

            </div>
          </div>
        </section>

        <section class="cta-band">
          <div class="container">
            <h2>Ready To Record?</h2>
            <a
              class="btn btn-solid"
              href="https://docs.google.com/forms/d/e/1FAIpQLSf44cyN2bdYfoEMPh-fRe0driMsOFy9_rSdxSju_usiPobDkA/viewform?usp=dialog"
              target="_blank"
              rel="noopener"
              >Book a Session</a
            >
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <div>
            <span class="logo-main">Group 1</span>
            <span class="logo-sub">Entertainment Studios</span>
            <p class="footer-meta">Marietta, GA</p>
            <p class="footer-meta">© 2025 Group 1 Entertainment LLC</p>
          </div>
          <div class="footer-links">
            <a href="https://instagram.com/group1ent" target="_blank" rel="noopener">Instagram →</a>
            <a
              href="https://docs.google.com/forms/d/e/1FAIpQLSf44cyN2bdYfoEMPh-fRe0driMsOFy9_rSdxSju_usiPobDkA/viewform?usp=dialog"
              target="_blank"
              rel="noopener"
              >Book Now →</a
            >
          </div>
        </div>
      </footer>

      <div class="lightbox" aria-hidden="true">
        <button type="button" class="lightbox-close" aria-label="Close image viewer">×</button>
        <img src="" alt="Expanded gallery view" />
      </div>
    </div>
    <script src="nav.js"></script>
  </body>
</html>
